<text x="450" y="656">All dimensions in millimetres unless noted.</text>
<text x="420" y="688">2.</text>
<text x="450" y="688">Crossfall 2.5% on traffic lanes and 4% on sealed</text>
<text x="450" y="712">shoulders, falling outward.</text>
<text x="420" y="744">3.</text>
<text x="450" y="744">Subsoil drainage to EDCM 202b, back of kerb.</text>
<text x="420" y="776">4.</text>
<text x="450" y="776">Pavement design to the Austroads Guide to Pavement</text>
<text x="450" y="800">Technology Part 2. Layer depths to the pavement design.</text>
<text x="420" y="832">5.</text>
<text x="450" y="832">Construction under live traffic conditions.</text>
<text x="420" y="864">6.</text>
<text x="450" y="864">Locate and verify all underground services by potholing</text>
<text x="450" y="888">or a certified locator before excavation. Refer to asset</text>
<text x="450" y="912">owners' responses for exclusion zones and permit</text>
<text x="450" y="936">requirements.</text>
