<pattern id="h-base" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="13" height="13" fill="#fff"/><line x1="0" y1="0" x2="0" y2="13" stroke="#333" stroke-width="1.6"/></pattern>
<pattern id="h-sub" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="16" height="16" fill="#fff"/><line x1="0" y1="0" x2="0" y2="16" stroke="#333" stroke-width="1.4"/><line x1="8" y1="4" x2="8" y2="11" stroke="#333" stroke-width="1.4"/></pattern>
<pattern id="h-filt" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#fff"/><g fill="none" stroke="#333" stroke-width="1"><circle cx="5" cy="5" r="2.6"/><circle cx="15.5" cy="4" r="2"/><circle cx="11" cy="12" r="2.8"/><circle cx="3.5" cy="16" r="2.1"/><circle cx="18" cy="17.5" r="2.4"/></g><g fill="#333"><circle cx="9" cy="3" r="0.9"/><circle cx="19" cy="10" r="0.9"/><circle cx="8" cy="19.5" r="0.9"/><circle cx="1.5" cy="10" r="0.9"/></g></pattern>
</defs>
