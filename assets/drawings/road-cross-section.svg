<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="xs-title xs-desc" font-family="Arial, Helvetica, sans-serif">
<title id="xs-title">Typical road cross-section, urban road pavement upgrade (coursework drawing, revision B)</title>
<desc id="xs-desc">Road cross-section drawing, not to scale. A crowned two-lane road with one 3500 mm traffic lane each way and a 1500 mm sealed shoulder each side, 10000 mm overall, with the centreline at the crown. Crossfall is 2.5% on the traffic lanes and 4% on the shoulders, falling outward. The pavement is asphalt surfacing (PMA) on a granular base over the subgrade. Each side has kerb and channel, a subsoil drain to EDCM 202b at the back of kerb (a slotted pipe in filter material) and the verge beyond. The sheet has a legend, six notes and a title block: Typical cross-section, scale NTS, dimensions in mm, revision B, September 2026.</desc>
